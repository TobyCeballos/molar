name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag de release, por ejemplo v1.1.0-beta.1'
        required: true
        default: 'v1.1.0-beta.1'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      # Test releases are intentionally unsigned until a Windows certificate is configured.
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Build frontend
        working-directory: frontend
        run: npm ci; npm run build
      - name: Build backend
        working-directory: backend
        run: mvn -q package -DskipTests
      - name: Set desktop version from tag
        working-directory: desktop
        shell: pwsh
        run: |
          $releaseTag = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.tag }}" } else { "${{ github.ref_name }}" }
          $version = $releaseTag.TrimStart('v')
          npm version $version --no-git-tag-version --allow-same-version
      - name: Build desktop installer
        working-directory: desktop
        run: |
          npm ci
          npm run dist -- --publish never
      - name: Checksum
        shell: pwsh
        run: Get-FileHash desktop/dist/Molar-Setup.exe -Algorithm SHA256 | Select-Object -ExpandProperty Hash | Out-File desktop/dist/Molar-Setup.exe.sha256
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: Molar ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          prerelease: ${{ contains(github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            desktop/dist/Molar-Setup.exe
            desktop/dist/Molar-Setup.exe.sha256
            desktop/dist/latest*.yml
            desktop/dist/*.blockmap
