server.port=8080
spring.datasource.url=jdbc:sqlite:file:${APPDATA:${user.home}/AppData/Roaming}/Molar/data/molar.db?mode=rwc
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.read-only=false
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jackson.time-zone=America/Argentina/Buenos_Aires
molar.files-dir=${APPDATA:${user.home}/AppData/Roaming}/Molar/files
molar.backups-dir=${APPDATA:${user.home}/AppData/Roaming}/Molar/backups
molar.control-url=${MOLAR_CONTROL_URL:https://molar-control.vercel.app}
molar.tenant-id=${MOLAR_TENANT_ID:de9752d0-dd2a-49fe-aa53-a1bec4f324c4}
molar.installation-id=${MOLAR_INSTALLATION_ID:}
molar.installation-token=${MOLAR_INSTALLATION_TOKEN:}
